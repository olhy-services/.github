<line x1="778" y1="120" x2="892" y2="120" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="835" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0d0d0e">adb · scrcpy-server</text>
