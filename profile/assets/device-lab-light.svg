<text x="64" y="134" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#52525b">espelho da tela</text>
<text x="64" y="158" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#52525b">+ DevTools</text>
