<text x="494" y="134" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#52525b">Node no seu computador</text>
<text x="494" y="158" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#52525b">127.0.0.1</text>
<rect x="900" y="60" width="300" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
